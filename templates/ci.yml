# Starter CI for a repository whose checks fit in one job of a few minutes.
# Copy to .github/workflows/ci.yml, then make the steps match the repository:
# its type check, lint, tests and the exact build command its deploy runs.
# A repository whose checks take longer starts from ci-jobs.yml instead.
#
# - Every check runs before merge, once per finished change. A draft runs
#   nothing; marking the pull request ready runs CI once.
# - CI runs the build the deploy runs, so a green pull request means the app
#   builds. The deploy only ships: it doesn't type-check again.
# - `check` is the one status to require. It runs on every ready pull request,
#   so a required check never waits forever, and it skips its work when the
#   pull request changes only docs.
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      # Docs are top-level Markdown and Markdown under docs/. If the app or
      # its tests read one of those files (a page the site renders, say),
      # narrow the pattern so changing it runs the checks.
      - name: Does this change need the checks?
        id: scope
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          CHANGED: ${{ github.event.pull_request.changed_files }}
        run: |
          # A renamed file counts under its old name too, so moving code into
          # docs/ still runs the checks. GitHub lists at most 3,000 files, so a
          # bigger pull request, or a failed lookup, runs everything.
          code=true
          if [ -n "$PR" ] && [ "${CHANGED:-0}" -lt 3000 ] \
            && files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[] | .filename, (.previous_filename // empty)') \
            && [ -n "$files" ] && ! grep -qvE '^([^/]+|docs/.+)\.md$' <<< "$files"; then
            code=false
            echo "Only docs changed, so the checks are skipped."
          fi
          echo "code=$code" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.scope.outputs.code == 'true'
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.scope.outputs.code == 'true'
        with:
          node-version: 24
          cache: npm

      - name: Install
        if: steps.scope.outputs.code == 'true'
        run: npm ci

      # The only type check: the deploy's build skips it (for Next.js,
      # typescript.ignoreBuildErrors in next.config).
      - name: Type check
        if: steps.scope.outputs.code == 'true'
        run: npm run typecheck

      - name: Lint
        if: steps.scope.outputs.code == 'true'
        run: npm run lint

      - name: Test
        if: steps.scope.outputs.code == 'true'
        run: npm test

      # The same command the deploy runs.
      - name: Build
        if: steps.scope.outputs.code == 'true'
        run: npm run build
