# Starter CI for a repository whose checks need several jobs: a suite split
# into shards, a separate app, a database. Copy to .github/workflows/ci.yml
# and replace the jobs and path areas with the repository's own.
#
# - Every check runs before merge, once per finished change. A draft runs
#   nothing; marking the pull request ready runs CI once. The nightly run
#   tests the default branch as merged.
# - `changes` decides which jobs a pull request needs from the files it
#   changes. A path it doesn't name runs everything, and every other event
#   (nightly, manual) runs everything. A workflow-level `paths:` filter would
#   leave the required check waiting forever, so filter jobs, not workflows.
# - CI runs the build the deploy runs, and the deploy only ships: the type
#   check runs here once, never again in the deploy's build.
# - `check` is the one status to require. It passes when every job passed or
#   was skipped, and fails when any failed or `changes` didn't run.
# - Every job repeats checkout, install and setup. Put small checks in one
#   job, install only what a job needs, and add shards only when measuring
#   the same commits shows a faster run without much more compute.
name: ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # 12:17 UTC is 5:17 AM PDT (4:17 AM PST).
  schedule:
    - cron: "17 12 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    if: ${{ !github.event.pull_request.draft }}
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
    outputs:
      web: ${{ steps.files.outputs.web }}
      worker: ${{ steps.files.outputs.worker }}
    steps:
      - name: Which jobs do the changed files need?
        id: files
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          CHANGED: ${{ github.event.pull_request.changed_files }}
        run: |
          # A renamed file counts under its old name too. GitHub lists at most
          # 3,000 files, so a bigger pull request, or a failed lookup, runs
          # everything.
          everything=$'web=true\nworker=true'
          if [ -z "$PR" ] || [ "${CHANGED:-0}" -ge 3000 ] \
            || ! files=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[] | .filename, (.previous_filename // empty)') \
            || [ -z "$files" ]; then
            echo "$everything" | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          web=false worker=false
          while IFS= read -r f; do
            # Top-level Markdown and Markdown under docs/ need no job. Other
            # Markdown may be read by the app or a test, so it falls through.
            [[ "$f" =~ ^([^/]+|docs/.+)\.md$ ]] && continue
            case "$f" in
              worker/* | Dockerfile.worker) worker=true ;;
              # Shared code and dependencies reach both.
              lib/* | package.json | package-lock.json) web=true worker=true ;;
              app/* | components/* | public/*) web=true ;;
              *) web=true worker=true ;;
            esac
          done <<< "$files"
          printf 'web=%s\nworker=%s\n' "$web" "$worker" | tee -a "$GITHUB_OUTPUT"

  # Small checks share one job, so they pay for one install.
  static:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Format
        run: npm run format:check
      # The only type check: the deploy's build skips it.
      - name: Type check
        run: npm run typecheck
      - name: Lint
        run: npm run lint

  test:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Test (shard ${{ matrix.shard }}/${{ strategy.job-total }})
        run: npx vitest run --shard=${{ matrix.shard }}/${{ strategy.job-total }}

  # The same command the deploy runs, so a green pull request means it builds.
  build:
    needs: changes
    if: needs.changes.outputs.web == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build
        run: npm run build

  # A service another platform builds from a Dockerfile: build the same image.
  worker:
    needs: changes
    if: needs.changes.outputs.worker == 'true'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build the worker image
        run: docker build -f Dockerfile.worker .

  check:
    if: ${{ !cancelled() && !github.event.pull_request.draft }}
    needs: [changes, static, test, build, worker]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 2
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          echo "$RESULTS" | jq -e '.changes.result == "success"
            and (to_entries | all(.value.result == "success" or .value.result == "skipped"))' >/dev/null
