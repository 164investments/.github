# Fixture for the runners self-test: every job and trigger here passes the check.
name: fixture

on:
  pull_request:
  push:
    branches: [main, staging]

concurrency:
  group: fixture-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  small:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    steps:
      - run: echo small
  large:
    runs-on: 'blacksmith-4vcpu-ubuntu-2404'
    steps:
      - run: echo large
  exception:
    runs-on: ubuntu-latest # github-runner: needs a kernel feature the fixture names
    steps:
      - run: echo exception
