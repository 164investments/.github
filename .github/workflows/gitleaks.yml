name: gitleaks

# Reusable secret scan with the gitleaks CLI.
#
# Modes:
# - auto (default): a pull request scans its own commits; a push scans the
#   pushed commits; any other event, or a push whose earlier commit is gone
#   (a new branch or a force-push), scans the whole history.
# - history: scan every commit.
# - tree: scan only the files in the checkout.
#
# gitleaks reads .gitleaks.toml and .gitleaksignore from the repository root
# when they exist. Findings are redacted in the log. The CLI is downloaded
# from the gitleaks release and checked against its published SHA-256.

on:
  workflow_call:
    inputs:
      runner:
        description: Runner label. Private repositories run on Blacksmith; a public repository can pass ubuntu-latest, which GitHub runs free.
        type: string
        default: blacksmith-2vcpu-ubuntu-2404
      mode:
        description: auto, history or tree.
        type: string
        default: auto
      config-path:
        description: gitleaks config file, relative to the repository root. Empty uses .gitleaks.toml when present, else gitleaks' default rules.
        type: string
        default: ""
      gitleaks-version:
        description: gitleaks release to use, without the leading v.
        type: string
        default: "8.30.1"
      timeout-minutes:
        description: Job timeout.
        type: number
        default: 15

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ${{ inputs.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: ${{ inputs.mode == 'tree' && 1 || 0 }}
          persist-credentials: false

      - name: Install gitleaks
        env:
          VERSION: ${{ inputs.gitleaks-version }}
        run: |
          set -euo pipefail
          case "$VERSION" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::gitleaks-version must look like 8.30.1"; exit 1 ;;
          esac
          dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$dir"
          cd "$dir"
          base="https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}"
          tarball="gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -fsSLO "$base/$tarball"
          curl -fsSLO "$base/gitleaks_${VERSION}_checksums.txt"
          grep " ${tarball}\$" "gitleaks_${VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "$tarball" gitleaks
          echo "$dir" >> "$GITHUB_PATH"

      - name: Scan
        env:
          MODE: ${{ inputs.mode }}
          CONFIG_PATH: ${{ inputs.config-path }}
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.event.after }}
        run: |
          set -euo pipefail
          args=(--redact --no-banner --verbose)
          if [ -n "$CONFIG_PATH" ]; then
            args+=(--config "$CONFIG_PATH")
          fi
          is_commit() {
            [ -n "$1" ] && [ "$1" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$1^{commit}" 2>/dev/null
          }

          case "$MODE" in
            tree)
              echo "Scanning the files in the checkout."
              gitleaks dir . "${args[@]}"
              ;;
            history)
              echo "Scanning every commit."
              gitleaks git . "${args[@]}"
              ;;
            auto)
              range=""
              if [ "$EVENT_NAME" = "pull_request" ] || [ "$EVENT_NAME" = "pull_request_target" ]; then
                if is_commit "$PR_BASE" && is_commit "$PR_HEAD"; then
                  range="$PR_BASE..$PR_HEAD"
                fi
              elif [ "$EVENT_NAME" = "push" ]; then
                if is_commit "$PUSH_BEFORE" && is_commit "$PUSH_AFTER"; then
                  range="$PUSH_BEFORE..$PUSH_AFTER"
                fi
              fi
              if [ -n "$range" ]; then
                echo "Scanning commits $range."
                gitleaks git . "${args[@]}" --log-opts="$range"
              else
                echo "Scanning every commit."
                gitleaks git . "${args[@]}"
              fi
              ;;
            *)
              echo "::error::mode must be auto, history or tree, not $MODE"
              exit 1
              ;;
          esac
