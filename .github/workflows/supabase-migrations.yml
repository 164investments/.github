name: supabase-migrations

# Reusable migration replay.
#
# Starts a throwaway Postgres 17 service container and applies every `.sql`
# file in the migrations folder, sorted by file name (byte order), with psql
# and ON_ERROR_STOP. It fails on the first file that errors and names it.
#
# The default image is Supabase's own Postgres 17 image, so the roles (anon,
# authenticated, service_role and the rest), the auth and storage schemas and
# the bundled extensions exist before the first migration, as they do on a
# hosted project. Use `prelude` for anything a project created outside its
# migrations, such as extra roles.

on:
  workflow_call:
    inputs:
      working-directory:
        description: Folder that the other paths are relative to.
        type: string
        default: "."
      migrations-path:
        description: Folder of migration files.
        type: string
        default: supabase/migrations
      prelude:
        description: Optional SQL file applied before the migrations.
        type: string
        default: ""
      image:
        description: Postgres 17 container image.
        type: string
        default: supabase/postgres:17.11.0.003
      single-transaction:
        description: Apply each file in its own transaction.
        type: boolean
        default: true
      user:
        description: Database role that applies the migrations. Hosted Supabase projects apply them as postgres.
        type: string
        default: postgres
      timeout-minutes:
        description: Job timeout.
        type: number
        default: 15

permissions:
  contents: read

jobs:
  replay:
    name: supabase-migrations
    runs-on: ubuntu-latest
    timeout-minutes: ${{ inputs.timeout-minutes }}
    services:
      postgres:
        image: ${{ inputs.image }}
        env:
          # Throwaway container, so a fixed password is fine. Supabase's image
          # sets both the postgres and supabase_admin passwords from it.
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -p 5432"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 60
    env:
      PGHOST: 127.0.0.1
      PGPORT: "5432"
      PGPASSWORD: postgres
      PGDATABASE: postgres
      PGUSER: ${{ inputs.user }}
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Wait for the database
        run: |
          for attempt in $(seq 1 60); do
            if psql -X -tAc 'select 1' >/dev/null 2>&1; then
              psql -X -tAc 'select version()'
              exit 0
            fi
            sleep 2
          done
          echo "::error::The database did not accept connections as $PGUSER."
          psql -X -tAc 'select 1'
          exit 1

      - name: Apply the prelude
        if: inputs.prelude != ''
        env:
          PRELUDE: ${{ inputs.prelude }}
        run: psql -X -q -v ON_ERROR_STOP=1 --single-transaction -f "$PRELUDE"

      - name: Replay the migrations
        env:
          MIGRATIONS_PATH: ${{ inputs.migrations-path }}
          SINGLE_TRANSACTION: ${{ inputs.single-transaction }}
        run: |
          set -euo pipefail
          if [ ! -d "$MIGRATIONS_PATH" ]; then
            echo "::error::No folder $MIGRATIONS_PATH."
            exit 1
          fi
          mapfile -t files < <(find "$MIGRATIONS_PATH" -maxdepth 1 -type f -name '*.sql' | LC_ALL=C sort)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "::error::No .sql files in $MIGRATIONS_PATH."
            exit 1
          fi

          flags=(-X -q -v ON_ERROR_STOP=1)
          if [ "$SINGLE_TRANSACTION" = "true" ]; then
            flags+=(--single-transaction)
          fi

          applied=0
          for file in "${files[@]}"; do
            echo "::group::$file"
            if ! psql "${flags[@]}" -f "$file"; then
              echo "::endgroup::"
              echo "::error file=$file::Migration failed after $applied of ${#files[@]} applied cleanly."
              exit 1
            fi
            echo "::endgroup::"
            applied=$((applied + 1))
          done
          echo "Replayed all ${#files[@]} migrations."
          echo "Replayed all ${#files[@]} migrations from \`$MIGRATIONS_PATH\` into \`$(psql -X -tAc 'show server_version')\`." >> "$GITHUB_STEP_SUMMARY"
