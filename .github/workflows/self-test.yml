name: self-test

# Calls every reusable workflow against the fixtures in tests/fixtures, and
# lints every workflow file. Required before merge. This repository is public,
# so its own runs use GitHub's free runners (runner: ubuntu-latest).

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: self-test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint workflows
        env:
          VERSION: "1.7.12"
        run: |
          set -euo pipefail
          dir="$RUNNER_TEMP/actionlint"
          mkdir -p "$dir"
          base="https://github.com/rhysd/actionlint/releases/download/v${VERSION}"
          tarball="actionlint_${VERSION}_linux_amd64.tar.gz"
          (cd "$dir" && curl -fsSLO "$base/$tarball" && curl -fsSLO "$base/actionlint_${VERSION}_checksums.txt" \
            && grep " ${tarball}\$" "actionlint_${VERSION}_checksums.txt" | sha256sum -c - \
            && tar -xzf "$tarball" actionlint)
          "$dir/actionlint" -color

  node-check-script:
    name: node-check (check script)
    uses: ./.github/workflows/node-check.yml
    with:
      runner: ubuntu-latest
      working-directory: tests/fixtures/node-check-script

  node-scripts:
    name: node-check (separate scripts)
    uses: ./.github/workflows/node-check.yml
    with:
      runner: ubuntu-latest
      working-directory: tests/fixtures/node-scripts
      env: |
        FIXTURE_FLAG=1

  python:
    name: python-check
    uses: ./.github/workflows/python-check.yml
    with:
      runner: ubuntu-latest
      working-directory: tests/fixtures/python-project

  # Python 3.9, the oldest the team-agents scripts support, has no build for
  # Ubuntu 26.04, which ubuntu-latest became on 2026-10-21.
  python-command:
    name: python-check (check-command)
    uses: ./.github/workflows/python-check.yml
    with:
      runner: ubuntu-24.04
      working-directory: tests/fixtures/python-project
      python-version: "3.9"
      check-command: python -m unittest discover -s tests -v

  gitleaks:
    name: gitleaks
    uses: ./.github/workflows/gitleaks.yml
    with:
      runner: ubuntu-latest

  gitleaks-history:
    name: gitleaks (history)
    uses: ./.github/workflows/gitleaks.yml
    with:
      runner: ubuntu-latest
      mode: history

  migrations:
    name: supabase-migrations
    uses: ./.github/workflows/supabase-migrations.yml
    with:
      runner: ubuntu-latest
      migrations-path: tests/fixtures/migrations

  migrations-plain-postgres:
    name: supabase-migrations (plain Postgres)
    uses: ./.github/workflows/supabase-migrations.yml
    with:
      runner: ubuntu-latest
      migrations-path: tests/fixtures/migrations
      image: postgres:17
      prelude: tests/fixtures/supabase-shape.sql

  runners:
    name: runners
    uses: ./.github/workflows/runners.yml
    with:
      runner: ubuntu-latest
      workflows-path: tests/fixtures/runners

  already-tested:
    name: already-tested
    permissions:
      actions: read
      contents: read
      pull-requests: read
    uses: ./.github/workflows/already-tested.yml
    with:
      runner: ubuntu-latest

  # A pull request's own run is never already tested; on a push to main the
  # answer depends on that push, so only the pull request asserts it.
  already-tested-answer:
    name: already-tested (a pull request runs its checks)
    if: github.event_name == 'pull_request'
    needs: already-tested
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: The answer is false
        env:
          TESTED: ${{ needs.already-tested.outputs.tested }}
        run: test "$TESTED" = false

  stop-after-failures-tests:
    name: stop-after-failures (unit tests)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Counting rule and decisions
        run: python3 -m unittest discover -s tests/stop-after-failures -v

  # Runs the step against this workflow's own runs, so the lookup is proven
  # against GitHub's API. A failed lookup only warns, so assert a count came
  # back. On a push the step does nothing and reports no count.
  stop-after-failures:
    name: stop-after-failures
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: stop
        uses: ./actions/stop-after-failures
      - name: The earlier runs were read
        if: github.event_name == 'pull_request'
        env:
          FAILED: ${{ steps.stop.outputs.failed }}
        run: '[[ "$FAILED" =~ ^[0-9]+$ ]]'
